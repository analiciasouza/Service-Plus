{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/lista-servicos.css' %}">
{% endblock %}


{% block content %}
<div class="servicos pt-5">
        <div class="container text-center">
            <div class="row">
                {% for servicos in servicos %}
                    <div class="col-6 col-sm-3  pt-3 border">
                        <div class="card-servico">
                            <div class="img">
                                {% if servicos.image %}
                                    <img src=" {{ servicos.image.url }} "
                                         class="image-fluid card-top"
                                         height="200"
                                         width="200"
                                         alt="Imagem do serviço">s
                                {% endif %}
                            </div>
                            <p>{{ servicos.title }}</p>
                            <p>{{ servicos.professional.nome_completo }}</p>
                            <a href="{{ servicos.get_absolute_url }}" target="_blank" class="btn btn-primary bg-dark text-white border">Contrate já!</a>
                        </div>
                    </div>
                {% endfor %}
            </div>
        </div>
    </div>
{% endblock content %}
